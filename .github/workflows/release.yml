name: Release public packages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - packages/ui/src/**
      - packages/ui/tailwind-preset.cjs
      - packages/ui/package.json
      - packages/viewer/src/**
      - packages/viewer/package.json
      - packages/sdk-typescript/src/**
      - packages/sdk-typescript/package.json
      - openapi/**
      - codegen/typescript-fetch.yaml
      - scripts/generate-sdks.mjs
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  # Pull-request CI validates normal releases before merge. A manual dispatch
  # has no PR gate, so it still validates before publishing.
  quality:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_quality.yml

  release:
    if: >-
      ${{ always() && (needs.quality.result == 'success' ||
      needs.quality.result == 'skipped') }}
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11.19.0

      - name: Create Toolpath release-bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TOOLPATH_ACTIONS_BOT_APP_ID }}
          private-key: ${{ secrets.TOOLPATH_ACTIONS_BOT_PK }}
          owner: toolpath
          repositories: toolpath

      # Pending Changesets create or update the release-metadata PR. Once that
      # PR merges, this action publishes only npm versions absent from npm.
      - name: Version or publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version: pnpm version-packages
          publish: pnpm release:npm
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'

      # The App-created PR triggers ordinary pull-request CI. GitHub merges it
      # only after the repository's protected-branch requirements succeed.
      - name: Enable auto-merge for the release-metadata PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: gh pr merge "${{ steps.changesets.outputs.pullRequestNumber }}" --auto --squash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
